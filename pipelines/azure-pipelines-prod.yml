trigger:
  branches:
    include:
      - prod

pool:
  vmImage: 'windows-latest'

jobs:
  - deployment: DeployToProd
    displayName: 'Deploy policies to Prod B2C'
    environment: 'Production'
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self

            - task: PowerShell@2
              displayName: 'Deploy policies to Prod B2C'
              inputs:
                filePath: 'scripts/DeployEnvironmentFolderToB2C.ps1'
                arguments: >
                  -PathToFolder "$(Build.SourcesDirectory)/Environments/Prod"
                  -ClientId "$(B2C_CLIENT_ID)"
                  -ClientSecret "$(B2C_CLIENT_SECRET)"
                  -TenantId "$(B2C_TENANT_ID)"
                  -ConfigFile "$(Build.SourcesDirectory)/deploy-config.json"
                  -BackupPath "$(Build.ArtifactStagingDirectory)/backups"

            - task: PublishBuildArtifacts@1
              displayName: 'Publish policy backups'
              condition: always()
              inputs:
                pathToPublish: '$(Build.ArtifactStagingDirectory)/backups'
                artifactName: 'policy-backups-prod'
